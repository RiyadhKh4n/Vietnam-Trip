<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vietnam 2026/title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F7F3ED;
    --deep: #1A1612;
    --gold: #C9973A;
    --gold-light: #F0D89A;
    --red: #B84040;
    --green: #3A7A5A;
    --green-light: #EBF4EE;
    --muted: #7A7268;
    --border: rgba(26,22,18,0.12);
    --card-bg: #FFFDF9;
    --amber-bg: #FFF8E8;
    --red-bg: #FFF0F0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--deep);
    font-size: 15px;
    line-height: 1.6;
  }

  /* HERO */
  .hero {
    background: var(--deep);
    color: var(--cream);
    padding: 60px 40px 48px;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      45deg,
      transparent,
      transparent 40px,
      rgba(201,151,58,0.04) 40px,
      rgba(201,151,58,0.04) 41px
    );
  }
  .hero-inner { position: relative; max-width: 900px; margin: 0 auto; }
  .hero-label {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 16px;
    font-weight: 500;
  }
  .hero h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(42px, 7vw, 72px);
    font-weight: 400;
    line-height: 1.05;
    margin-bottom: 6px;
  }
  .hero h1 em { font-style: italic; color: var(--gold); }
  .hero-sub {
    font-size: 15px;
    color: rgba(247,243,237,0.55);
    margin-top: 14px;
    font-weight: 300;
  }
  .hero-meta {
    display: flex;
    gap: 32px;
    margin-top: 36px;
    flex-wrap: wrap;
  }
  .hero-stat-val {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    color: var(--gold);
    line-height: 1;
  }
  .hero-stat-label {
    font-size: 11px;
    color: rgba(247,243,237,0.45);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-top: 4px;
  }
  .hero-divider {
    width: 1px;
    background: rgba(247,243,237,0.1);
    align-self: stretch;
  }

  /* FLIGHT BANNER */
  .flight-banner {
    background: var(--deep);
    border-top: 1px solid rgba(201,151,58,0.2);
    padding: 0 40px;
  }
  .flight-banner-inner {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    gap: 0;
    overflow-x: auto;
  }
  .flight-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 24px;
    border-right: 1px solid rgba(201,151,58,0.12);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .flight-item:first-child { padding-left: 0; }
  .flight-code {
    font-family: 'Playfair Display', serif;
    font-size: 13px;
    color: var(--gold);
    font-weight: 600;
  }
  .flight-route { font-size: 12px; color: rgba(247,243,237,0.6); }
  .flight-dir {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: rgba(247,243,237,0.3);
  }

  /* LAYOUT */
  .main { max-width: 900px; margin: 0 auto; padding: 40px 40px 80px; }

  /* SECTION HEADERS */
  .section-header {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 20px;
    margin-top: 48px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .section-header:first-child { margin-top: 0; }
  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 400;
  }
  .section-meta {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  /* NAV TABS */
  .tab-nav {
    display: flex;
    gap: 4px;
    margin-bottom: 32px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    background: var(--cream);
    z-index: 10;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .tab-btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    padding: 7px 14px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.03em;
  }
  .tab-btn:hover { border-color: var(--gold); color: var(--gold); }
  .tab-btn.active { background: var(--deep); color: var(--cream); border-color: var(--deep); }

  /* PANELS */
  .panel { display: none; }
  .panel.active { display: block; }

  /* ITINERARY CARDS */
  .destination-block { margin-bottom: 40px; }
  .dest-header {
    display: grid;
    grid-template-columns: 48px 1fr auto;
    gap: 16px;
    align-items: start;
    margin-bottom: 16px;
  }
  .dest-num {
    font-family: 'Playfair Display', serif;
    font-size: 36px;
    color: var(--gold);
    line-height: 1;
    opacity: 0.5;
    text-align: right;
  }
  .dest-name {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 600;
    line-height: 1.1;
  }
  .dest-dates { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .dest-nights {
    font-size: 11px;
    background: var(--deep);
    color: var(--cream);
    padding: 4px 10px;
    border-radius: 12px;
    letter-spacing: 0.05em;
    white-space: nowrap;
    font-weight: 500;
  }
  .weather-pill {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 12px;
    margin-top: 6px;
    display: inline-block;
    font-weight: 500;
  }
  .weather-ok { background: var(--green-light); color: var(--green); }
  .weather-warn { background: var(--red-bg); color: var(--red); }
  .weather-ok-ish { background: var(--amber-bg); color: #7A5A00; }

  .hotel-row {
    background: var(--amber-bg);
    border: 1px solid rgba(201,151,58,0.2);
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 14px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }
  .hotel-icon { font-size: 18px; flex-shrink: 0; margin-top: 2px; }
  .hotel-name { font-weight: 500; font-size: 14px; }
  .hotel-detail { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .days-grid { display: flex; flex-direction: column; gap: 12px; }
  .day-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .day-card-header {
    background: var(--deep);
    color: var(--cream);
    padding: 10px 16px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.05em;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .day-card-header span { color: rgba(247,243,237,0.5); font-weight: 300; }
  .day-card-body { padding: 14px 16px; }
  .activity-list { list-style: none; }
  .activity-list li {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 5px 0;
    border-bottom: 1px solid rgba(26,22,18,0.05);
    font-size: 13.5px;
    line-height: 1.5;
  }
  .activity-list li:last-child { border-bottom: none; }
  .activity-list li::before {
    content: '→';
    color: var(--gold);
    font-size: 12px;
    flex-shrink: 0;
    margin-top: 3px;
  }
  .map-link {
    font-size: 11px;
    color: var(--green);
    text-decoration: none;
    border: 1px solid var(--green);
    padding: 2px 8px;
    border-radius: 10px;
    white-space: nowrap;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .map-link:hover { background: var(--green); color: white; }

  .note-box {
    background: var(--amber-bg);
    border-left: 3px solid var(--gold);
    padding: 10px 14px;
    border-radius: 0 6px 6px 0;
    font-size: 13px;
    color: #5A4800;
    margin: 12px 0;
    line-height: 1.5;
  }
  .warn-box {
    background: var(--red-bg);
    border-left: 3px solid var(--red);
    padding: 10px 14px;
    border-radius: 0 6px 6px 0;
    font-size: 13px;
    color: var(--red);
    margin: 12px 0;
    line-height: 1.5;
  }

  /* LOGISTICS */
  .flights-table, .transfers-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .flights-table th, .transfers-table th {
    text-align: left;
    padding: 8px 12px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    font-weight: 500;
  }
  .flights-table td, .transfers-table td {
    padding: 10px 12px;
    border-bottom: 1px solid rgba(26,22,18,0.06);
    vertical-align: top;
  }
  .flights-table tr:last-child td, .transfers-table tr:last-child td { border-bottom: none; }
  .flights-table tr:hover td, .transfers-table tr:hover td { background: rgba(201,151,58,0.04); }
  .flight-num { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 14px; }
  .cost-pill {
    background: var(--green-light);
    color: var(--green);
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 500;
  }
  .warn-pill {
    background: var(--red-bg);
    color: var(--red);
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 500;
  }

  /* TO-DO */
  .todo-section { margin-bottom: 32px; }
  .todo-phase {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--muted);
    font-weight: 500;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .todo-grid { display: flex; flex-direction: column; gap: 6px; }
  .todo-item {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .todo-item:hover { border-color: rgba(26,22,18,0.2); }
  .todo-item.done { opacity: 0.45; }
  .todo-item.done .todo-text { text-decoration: line-through; }
  .todo-check {
    width: 18px;
    height: 18px;
    border: 1.5px solid var(--border);
    border-radius: 4px;
    flex-shrink: 0;
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: var(--green);
    background: white;
    transition: all 0.15s;
  }
  .todo-item.done .todo-check {
    background: var(--green);
    border-color: var(--green);
    color: white;
  }
  .todo-text { font-size: 13.5px; line-height: 1.5; flex: 1; }
  .todo-tag {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    background: var(--amber-bg);
    color: #7A5A00;
    font-weight: 500;
    white-space: nowrap;
    flex-shrink: 0;
    align-self: flex-start;
  }
  .todo-tag.urgent { background: var(--red-bg); color: var(--red); }

  /* BUDGET */
  .budget-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .budget-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .budget-cat { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; }
  .budget-val { font-family: 'Playfair Display', serif; font-size: 20px; }
  .budget-total {
    background: var(--deep);
    color: var(--cream);
    border-radius: 10px;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .budget-total-label { font-size: 12px; color: rgba(247,243,237,0.5); text-transform: uppercase; letter-spacing: 0.1em; }
  .budget-total-val { font-family: 'Playfair Display', serif; font-size: 28px; color: var(--gold); }

  /* POINTS */
  .points-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .points-table th {
    text-align: left; padding: 8px 12px;
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--muted); border-bottom: 1px solid var(--border); font-weight: 500;
  }
  .points-table td { padding: 10px 12px; border-bottom: 1px solid rgba(26,22,18,0.06); }
  .points-table tr:last-child td { border-bottom: none; }

  /* CONTACTS */
  .contacts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
  .contact-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
  }
  .contact-name { font-weight: 500; font-size: 13.5px; margin-bottom: 4px; }
  .contact-link { font-size: 12px; color: var(--green); text-decoration: none; display: block; }
  .contact-link:hover { text-decoration: underline; }
  .contact-phone { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* SUMMARY TIMELINE */
  .timeline { display: flex; flex-direction: column; gap: 0; }
  .tl-item {
    display: grid;
    grid-template-columns: 80px 24px 1fr;
    gap: 0 16px;
    align-items: stretch;
  }
  .tl-dates { font-size: 11px; color: var(--muted); padding: 12px 0; text-align: right; }
  .tl-line { display: flex; flex-direction: column; align-items: center; }
  .tl-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--gold);
    flex-shrink: 0;
    margin-top: 14px;
  }
  .tl-track { flex: 1; width: 1px; background: var(--border); }
  .tl-content { padding: 10px 0 20px; }
  .tl-place { font-weight: 500; font-size: 14px; }
  .tl-info { font-size: 12px; color: var(--muted); margin-top: 2px; }

  @media (max-width: 600px) {
    .hero { padding: 40px 20px 36px; }
    .main { padding: 28px 20px 60px; }
    .dest-header { grid-template-columns: 36px 1fr; }
    .dest-nights { display: none; }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <div class="hero-label">5 November – 29 November 2026 · 2 Travellers</div>
    <h1>Vietnam <em>2026</em></h1>
    <div class="hero-sub">Hanoi · Lan Ha Bay · Ha Giang · Hoi An · Dalat · Ho Chi Minh City · Phu Quoc</div>
    <div class="hero-meta">
      <div class="hero-stat">
        <div class="hero-stat-val">22</div>
        <div class="hero-stat-label">Nights</div>
      </div>
      <div class="hero-divider"></div>
      <div class="hero-stat">
        <div class="hero-stat-val">7</div>
        <div class="hero-stat-label">Destinations</div>
      </div>
      <div class="hero-divider"></div>
      <div class="hero-stat">
        <div class="hero-stat-val">QR4</div>
        <div class="hero-stat-label">Outbound</div>
      </div>
      <div class="hero-divider"></div>
      <div class="hero-stat">
        <div class="hero-stat-val">Avios</div>
        <div class="hero-stat-label">Redemption</div>
      </div>
    </div>
  </div>
</div>

<div class="flight-banner">
  <div class="flight-banner-inner">
    <div class="flight-item">
      <div>
        <div class="flight-dir">Outbound</div>
        <div class="flight-code">QR4</div>
        <div class="flight-route">LHR T4 → DOH · 14:15 Thu 5 Nov</div>
      </div>
    </div>
    <div class="flight-item">
      <div>
        <div class="flight-dir">Outbound</div>
        <div class="flight-code">QR976</div>
        <div class="flight-route">DOH → HAN T2 · 01:50 Fri 6 Nov → 12:20</div>
      </div>
    </div>
    <div class="flight-item">
      <div>
        <div class="flight-dir">Return</div>
        <div class="flight-code">QR971</div>
        <div class="flight-route">SGN T2 → DOH · 19:40 Sat 28 Nov</div>
      </div>
    </div>
    <div class="flight-item">
      <div>
        <div class="flight-dir">Return</div>
        <div class="flight-code">QR107</div>
        <div class="flight-route">DOH → LHR T4 · 02:00 Sun 29 Nov → 06:35</div>
      </div>
    </div>
  </div>
</div>

<div class="main">

  <div class="tab-nav">
    <button class="tab-btn active" onclick="showTab('itinerary')">Day-by-Day</button>
    <button class="tab-btn" onclick="showTab('overview')">Overview</button>
    <button class="tab-btn" onclick="showTab('logistics')">Flights & Transfers</button>
    <button class="tab-btn" onclick="showTab('todo')">To-Do List</button>
    <button class="tab-btn" onclick="showTab('budget')">Budget & Points</button>
    <button class="tab-btn" onclick="showTab('contacts')">Key Contacts</button>
  </div>

  <!-- ITINERARY PANEL -->
  <div id="panel-itinerary" class="panel active">

    <div style="background:#FFF8E8; border:1px solid rgba(201,151,58,0.3); border-radius:10px; padding:16px 20px; margin-bottom:28px;">
      <div style="font-size:12px; font-weight:600; color:#7A5A00; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:8px;">⚠ Itinerary — Key Changes v3</div>
      <div style="font-size:13px; color:#5A4800; line-height:1.7;">
        <strong>Days of week corrected.</strong> Built against the actual 2026 calendar throughout. 5 Nov 2026 is a Thursday. All downstream dates cascade correctly.<br><br>
        <strong>Ninh Binh dropped.</strong> Removed entirely. The Trang An sampan and Mua Cave were lovely but the geography forced a punishing 7hr van transfer to Ha Giang the next morning.<br><br>
        <strong>Lan Ha Bay 1-night cruise added (Sun 8 – Mon 9 Nov).</strong> Heritage Line Ylang / Stellar of the Seas / Genesis Regal — kayaking into Dark Cave, sunrise tai chi, sail back Mon midday. £200–280pp all-inclusive.<br><br>
        <strong>Ha Giang shifted to Tue 10 – Fri 13 Nov.</strong> Road Kings Day 1 starts Tuesday morning, after a Mon evening settling in Ha Giang City following the cruise return and Hanoi → Ha Giang van.<br><br>
        <strong>Day 8 exit is Pullman Noi Bai overnight — confirmed, not a fallback.</strong> Road Kings 4-day tours finish 14:00–15:30 in Ha Giang City. Van to Hanoi gets in ~20:30–21:30. <strong>Sofitel concierge couriers the 30kg bags to Noi Bai airport in advance</strong> — no city-centre diversion. Pullman shuttle to the airport hotel (~£80/night), then early HAN→DAN Sat 14 Nov morning.<br><br>
        <strong>Hoi An now arrives Sat 14 Nov morning with full 2-day tailoring.</strong> Measurements Sat, fittings + collection Sun. Materially less rushed than v2.<br><br>
        <strong>Hoi An flood risk elevated.</strong> November 2025 flooded the Old Town 2–8 Nov and again 15–19 Nov — exactly these dates a year prior. Hanoi leather shops (Lanh Leather, HuongCraft) become the primary commission route; Hoi An leather is now a bonus, not the mission. My Son Sanctuary is the wet-day full-day contingency.<br><br>
        <strong>Phu Quoc corrected to 5 nights.</strong> JW Marriott Cat 7 ~350k Bonvoy pts total. Park Hyatt final night Fri 27 Nov retained.<br><br>
        <strong>PQC → SGN must be the 07:00–08:00 departure.</strong> Qatar T2 check-in closes ~16:40 on Sat 28 Nov; 15:00 landing leaves only ~100 min for T1→T2 transfer, which is insufficient. Non-negotiable.
      </div>
    </div>

    <!-- HANOI -->
    <div class="destination-block">
      <div class="dest-header">
        <div class="dest-num">01</div>
        <div>
          <div class="dest-name">Hanoi</div>
          <div class="dest-dates">6–7 November · Arrive 12:20 Fri from Doha</div>
          <span class="weather-pill weather-ok">20–27°C · 7hrs sun · ✓ Good</span>
        </div>
        <div class="dest-nights">2 nights</div>
      </div>
      <div class="hotel-row">
        <div class="hotel-icon">🏨</div>
        <div>
          <div class="hotel-name">Sofitel Legend Metropole — Historic Wing Suite</div>
          <div class="hotel-detail">Amex FHR: breakfast included · £100 credit · upgrade on arrival · Store 30kg cases here</div>
        </div>
      </div>
      <div class="note-box">Pack 20L daypack only for the Lan Ha Bay cruise and the Ha Giang loop. Leave 30kg cases stored securely at the Sofitel (free). Sofitel concierge will courier the cases to Noi Bai airport in time for the Pullman overnight on Fri 13 Nov — no city-centre diversion on the Day 8 transit. Confirm the courier arrangement in writing before departure from Hanoi.</div>
      <div class="days-grid">
        <div class="day-card">
          <div class="day-card-header">Day 1 — Friday 6 Nov <span>Arrival day</span></div>
          <div class="day-card-body">
            <ul class="activity-list">
              <li>Arrive Noi Bai Airport T2 · 12:20 · Grab taxi to Sofitel Metropole <a class="map-link" href="https://maps.google.com/?q=Sofitel+Legend+Metropole+Hanoi" target="_blank">Map</a></li>

<script>
function showTab(name) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  event.target.classList.add('active');
}

function toggleTodo(el) {
  el.classList.toggle('done');
  const check = el.querySelector('.todo-check');
  check.textContent = el.classList.contains('done') ? '✓' : '';
}
</script>
